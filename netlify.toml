[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"

# Nitro outputs the Netlify function handler here automatically
# No manual [functions] config needed — Nitro writes netlify.json + the function

# Route everything through the SSR function (SPA/SSR catch-all)
[[redirects]]
  from   = "/*"
  to     = "/.netlify/functions/server"
  status = 200
