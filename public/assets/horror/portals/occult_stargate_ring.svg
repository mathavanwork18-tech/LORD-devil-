<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="portalCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020003" />
      <stop offset="50%" stop-color="#3d030c" />
      <stop offset="85%" stop-color="#ff001e" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>
  <!-- Swirling event horizon -->
  <circle cx="100" cy="100" r="95" fill="url(#portalCore)" />
  <!-- Concentric Runic Rings -->
  <circle cx="100" cy="100" r="88" stroke="#ff001e" stroke-width="2" stroke-dasharray="12 6" opacity="0.8" />
  <circle cx="100" cy="100" r="76" stroke="#7A0C16" stroke-width="1.5" stroke-dasharray="6 3" />
  <circle cx="100" cy="100" r="64" stroke="#B06D35" stroke-width="1" stroke-dasharray="4 8" />
  <circle cx="100" cy="100" r="50" stroke="#ff001e" stroke-width="2.5" />
  <!-- Portal Nodes / Spikes -->
  <polygon points="100,2 105,16 95,16" fill="#ff001e" />
  <polygon points="100,198 105,184 95,184" fill="#ff001e" />
  <polygon points="2,100 16,105 16,95" fill="#ff001e" />
  <polygon points="198,100 184,105 184,95" fill="#ff001e" />
  <polygon points="31,31 43,39 39,43" fill="#B06D35" />
  <polygon points="169,31 157,39 161,43" fill="#B06D35" />
  <polygon points="31,169 43,161 39,157" fill="#B06D35" />
  <polygon points="169,169 157,161 161,157" fill="#B06D35" />
  <!-- Inner Void Singularity -->
  <circle cx="100" cy="100" r="28" fill="#000000" stroke="#ff001e" stroke-width="1.5" filter="drop-shadow(0 0 10px #ff001e)" />
</svg>
