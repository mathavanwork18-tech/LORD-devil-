  <path d="M50 42 C54 48 56 54 50 62 C44 54 46 48 50 42 Z" fill="#ff001e" filter="drop-shadow(0 0 6px #ff001e)" />
  <circle cx="50" cy="54" r="2.5" fill="#ffffff" />
  <!-- Lantern Base -->
  <path d="M32 72 L68 72 L72 82 L28 82 Z" fill="#241d24" stroke="#B06D35" stroke-width="1.8" />
