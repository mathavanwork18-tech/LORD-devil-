      <stop offset="0%" stop-color="#ff001e" />
      <stop offset="40%" stop-color="#7A0C16" />
      <stop offset="70%" stop-color="#1c0716" />
      <stop offset="100%" stop-color="#050105" />
    </radialGradient>
  </defs>
  <!-- Handle Ring -->
  <circle cx="50" cy="12" r="7" stroke="#B06D35" stroke-width="2.5" />
