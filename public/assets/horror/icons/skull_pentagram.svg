<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer occult circle -->
  <circle cx="50" cy="50" r="45" stroke="#ff001e" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.8" />
  <circle cx="50" cy="50" r="38" stroke="#7A0C16" stroke-width="1" />
  <!-- Inverted Pentagram lines -->
  <polygon points="50,88 24,18 92,62 8,62 76,18" stroke="#B31324" stroke-width="1.8" fill="rgba(122,12,22,0.15)" />
  <!-- Skull in center -->
  <path d="M38 38 C38 28 62 28 62 38 C62 46 58 48 58 54 L42 54 C42 48 38 46 38 38 Z" fill="#0c0407" stroke="#ff001e" stroke-width="1.5" />
  <!-- Eye sockets -->
  <circle cx="45" cy="38" r="3.5" fill="#ff001e" />
  <circle cx="55" cy="38" r="3.5" fill="#ff001e" />
  <!-- Nasal cavity -->
  <polygon points="50,44 48,47 52,47" fill="#ff001e" />
  <!-- Teeth -->
  <line x1="44" y1="54" x2="44" y2="58" stroke="#ff001e" stroke-width="1" />
  <line x1="48" y1="54" x2="48" y2="58" stroke="#ff001e" stroke-width="1" />
  <line x1="52" y1="54" x2="52" y2="58" stroke="#ff001e" stroke-width="1" />
  <line x1="56" y1="54" x2="56" y2="58" stroke="#ff001e" stroke-width="1" />
</svg>
